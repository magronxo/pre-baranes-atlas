<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRE-BARANES Atlas — Modules</title>
<link rel="stylesheet" href="./modules-atlas.css">
</head>
<body>
<div class="app">
<header class="top">
  <div>
    <h1>Atlas · Modules</h1>
    <div class="sub">Raw modules · responsibilities · modelable relations · View / Design</div>
  </div>
  <nav class="nav">
    <a href="./index.html">Home</a>
    <button id="save" class="primary" type="button">Save layout</button>
    <button id="fit" type="button">Fit</button>
  </nav>
</header>
<main class="canvas">
  <svg id="g" viewBox="0 0 1640 900" aria-label="Mapa modular PRE-BARANES / BARANES">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
      <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
      <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
      <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
      <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    </defs>
    <g id="zones"></g>
    <g id="edges"></g>
    <g id="nodes"></g>
    <g id="labels"></g>
    <g id="edge-handles"></g>
  </svg>
  <div id="status" class="status">Mou mòduls o els dos punts de cada fletxa · Save layout per conservar-ho</div>
</main>
</div>
<script src="./modules-atlas.js"></script>
<script src="./modules-atlas-mode.js"></script>
</body>
</html>
