<body data-mode="design">
<div class="app">
<header class="top">
  <div>
    <h1>Atlas · RepoOps Flow</h1>
    <div class="sub"><span class="target-badge">TARGET COGNITIVE MODEL</span><span>Phase 4 · lifecycle · wrappers · primitives · identity trace</span></div>
  </div>
  <nav class="nav">
    <a href="./index.html">Home</a>
    <a href="./react-flow-test.html">System Atlas</a>

    <button id="save" class="primary" type="button">Save layout</button>
    <button id="fit" type="button">Fit</button>
  </nav>
</header>
<main class="canvas">
  <svg id="g" viewBox="0 0 1810 1120" aria-label="RepoOps target cognitive flow atlas">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
      <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
      <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
      <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
      <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f472b6"/></marker>
      <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
    </defs>
    <g id="zones"></g>
    <g id="edges"></g>
    <g id="nodes"></g>
    <g id="labels"></g>
    <g id="edge-handles"></g>
  </svg>
  <div id="status" class="status">Phase 4 · primitives visibles · Design per modelar · View per entendre wrappers</div>
</main>
</div>
<script src="./repoops-flow-layout-v2.js"></script>
<script src="./repoops-flow.js"></script>
<script src="./repoops-flow-phase2.js"></script>
<script>
(()=>{
const nodes=document.getElementById('nodes'),layer=document.getElementById('phase2-boundaries');if(!nodes||!layer)return;
function box(id){const g=nodes.querySelector(`[data-id="${id}"]`);if(!g)return null;const r=g.querySelector('.box'),m=(g.getAttribute('transform')||'').match(/translate\(\s*([-+\d.eE]+)[ ,]+([-+\d.eE]+)\s*\)/);if(!r||!m)return null;return{x:+m[1],y:+m[2],w:+r.getAttribute('width'),h:+r.getAttribute('height')}}
function draw(){const p=box('planOpenCode'),i=box('implementer'),c=box('candidate'),g=box('gitAdoption');if(!p||!i||!c||!g)return;const paths=layer.querySelectorAll('path'),texts=layer.querySelectorAll('text');if(paths.length<2||texts.length<6)return;
 const x=(p.x+p.w+i.x)/2,y1=Math.min(p.y,i.y)-16,y2=Math.max(p.y+p.h,i.y+i.h)+10;paths[0].setAttribute('d',`M${x} ${y1}V${y2}`);texts[0].setAttribute('x',x-86);texts[0].setAttribute('y',y1-2);texts[1].setAttribute('x',x+10);texts[1].setAttribute('y',y1-2);texts[2].setAttribute('x',x-118);texts[2].setAttribute('y',y2-5);
 const y=(c.y+c.h+g.y)/2,x1=Math.min(c.x,g.x)-24,x2=Math.max(c.x+c.w,g.x+g.w)+24;paths[1].setAttribute('d',`M${x1} ${y}H${x2}`);texts[3].setAttribute('x',x1+4);texts[3].setAttribute('y',y-4);texts[4].setAttribute('x',(x1+x2)/2-20);texts[4].setAttribute('y',y+11);texts[5].setAttribute('x',x2-4);texts[5].setAttribute('y',y+11);
}
new MutationObserver(()=>requestAnimationFrame(draw)).observe(nodes,{subtree:true,attributes:true,attributeFilter:['transform']});draw();
})();
</script>
<script src="./repoops-flow-phase3.js"></script>
<script src="./repoops-flow-polish-v1.js"></script>
<script src="./repoops-flow-phase4.js"></script>
</body>
</html>
