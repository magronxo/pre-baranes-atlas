<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRE-BARANES Atlas — React Flow Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.11.2/dist/style.css">
  <style>
    :root{color-scheme:light;--bg:#f4f6f9;--panel:#ffffff;--border:#d9e0e8;--text:#172033;--muted:#697586;--accent:#3157d5;--human:#fff8e8;--agent:#eef4ff;--channel:#eefaf3;--line:#8391a5}
    *{box-sizing:border-box}html,body,#root{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .shell{height:100%;display:grid;grid-template-rows:auto 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--border)}
    .title h1{font-size:16px;margin:0}.title p{font-size:12px;color:var(--muted);margin:3px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:12px;background:#fff}.nav a.active{border-color:#9eace1;background:#eef2ff;color:#2948ad}
    .stage{position:relative;min-height:0;background:radial-gradient(circle at 1px 1px,#dce2ea 1px,transparent 1px);background-size:24px 24px}
    #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);color:var(--muted);font-size:14px}.status-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;max-width:420px;box-shadow:0 8px 28px rgba(16,24,40,.07)}
    .atlas-node{width:210px;border:1px solid var(--border);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(16,24,40,.08);overflow:hidden}.atlas-node .kind{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 13px 0}.atlas-node .name{font-size:15px;font-weight:650;padding:5px 13px 13px}.atlas-node.human{background:var(--human)}.atlas-node.agent{background:var(--agent)}.atlas-node.channel{background:var(--channel)}
    .react-flow__node{border:0!important;background:transparent!important;box-shadow:none!important;padding:0!important}.react-flow__edge-path{stroke:var(--line);stroke-width:1.8}.react-flow__edge-text{font-size:11px;fill:#4f5d70}.react-flow__edge-textbg{fill:#fff;fill-opacity:.96}.react-flow__handle{width:10px;height:10px;background:#5d6d83;border:2px solid #fff}.react-flow__controls{box-shadow:none!important;border:1px solid var(--border);overflow:hidden}.react-flow__controls-button{border-bottom:1px solid var(--border)!important;background:#fff!important}.react-flow__minimap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff!important}
    .hint{position:absolute;z-index:5;left:16px;bottom:16px;border:1px solid var(--border);background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--muted);pointer-events:none}
    @media(max-width:720px){.topbar{align-items:flex-start;flex-direction:column}.atlas-node{width:170px}.nav a:nth-child(-n+2){display:none}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="title"><h1>Atlas · React Flow Prototype</h1><p>Prova mínima d’interacció i llenguatge visual</p></div>
    <nav class="nav"><a href="./index.html">Overview</a><a href="./flow.html">Relational Flow</a><a class="active" href="./react-flow-test.html">React Flow Test</a></nav>
  </header>
  <main class="stage">
    <div id="root" style="position:absolute;inset:0"></div>
    <div id="loading"><div class="status-card"><strong>Carregant mapa interactiu…</strong><div style="margin-top:6px">Si aquest missatge no desapareix, la llibreria externa no s’ha pogut carregar.</div></div></div>
    <div class="hint">Arrossega nodes · zoom/pan · crea connexions des dels punts laterals</div>
  </main>
</div>
<script>
  window.addEventListener('error',function(e){
    var box=document.getElementById('loading');
    if(box){box.style.display='grid';box.innerHTML='<div class="status-card"><strong>No s’ha pogut iniciar React Flow.</strong><div style="margin-top:6px">'+(e.message||'Error de càrrega')+'</div></div>';}
  });
</script>
<script type="module">
  try {
    const ReactModule = await import('https://esm.sh/react@18.3.1');
    const React = ReactModule.default;
    const { useCallback } = ReactModule;
    const { createRoot } = await import('https://esm.sh/react-dom@18.3.1/client');
    const RF = await import('https://esm.sh/@xyflow/react@12.11.2?deps=react@18.3.1,react-dom@18.3.1');
    const { ReactFlow, Background, Controls, MiniMap, Handle, Position, addEdge, useNodesState, useEdgesState, MarkerType } = RF;
    const h = React.createElement;

    function AtlasNode({data}){
      return h('div',{className:'atlas-node '+data.tone},
        h(Handle,{type:'target',position:Position.Left}),
        h('div',{className:'kind'},data.kind),
        h('div',{className:'name'},data.label),
        h(Handle,{type:'source',position:Position.Right})
      );
    }

    const nodeTypes={atlas:AtlasNode};
    const initialNodes=[
      {id:'oriol',type:'atlas',position:{x:40,y:210},data:{label:'Oriol',kind:'Owner / PM',tone:'human'}},
      {id:'chatgpt',type:'atlas',position:{x:360,y:210},data:{label:'ChatGPT / Master',kind:'Master',tone:'agent'}},
      {id:'architect',type:'atlas',position:{x:700,y:210},data:{label:'Architect Agent',kind:'Agent',tone:'agent'}},
      {id:'telegram',type:'atlas',position:{x:360,y:400},data:{label:'Telegram',kind:'Interface / Channel',tone:'channel'}}
    ];
    const arrow={type:MarkerType.ArrowClosed,width:18,height:18,color:'#8391a5'};
    const initialEdges=[
      {id:'o-c',source:'oriol',target:'chatgpt',label:'intent / decisions',type:'smoothstep',markerEnd:arrow},
      {id:'c-a',source:'chatgpt',target:'architect',label:'delegate / route',type:'smoothstep',markerEnd:arrow},
      {id:'a-c',source:'architect',target:'chatgpt',label:'result / evidence',type:'smoothstep',markerEnd:arrow},
      {id:'t-o',source:'telegram',target:'oriol',label:'attention / delivery',type:'smoothstep',markerEnd:arrow}
    ];

    function App(){
      const [nodes,setNodes,onNodesChange]=useNodesState(initialNodes);
      const [edges,setEdges,onEdgesChange]=useEdgesState(initialEdges);
      const onConnect=useCallback((params)=>setEdges((eds)=>addEdge({...params,type:'smoothstep',markerEnd:arrow},eds)),[]);
      return h(ReactFlow,{nodes,edges,nodeTypes,onNodesChange,onEdgesChange,onConnect,fitView:true,fitViewOptions:{padding:.25},minZoom:.4,maxZoom:1.7,defaultEdgeOptions:{type:'smoothstep'},colorMode:'light'},
        h(Background,{gap:24,size:1,color:'#dce2ea'}),
        h(MiniMap,{pannable:true,zoomable:true,nodeStrokeWidth:2,nodeColor:'#e9edf3'}),
        h(Controls,null)
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
    document.getElementById('loading').style.display='none';
  } catch (err) {
    const box=document.getElementById('loading');
    box.style.display='grid';
    box.innerHTML='<div class="status-card"><strong>No s’ha pogut iniciar React Flow.</strong><div style="margin-top:6px">'+String(err && err.message ? err.message : err)+'</div></div>';
    console.error(err);
  }
</script>
</body>
</html>
