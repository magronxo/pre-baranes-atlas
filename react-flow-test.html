<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRE-BARANES Atlas — React Flow Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.11.2/dist/style.css">
  <style>
    :root{color-scheme:light;--bg:#f6f8fb;--panel:#fff;--border:#d9e0e8;--text:#182230;--muted:#667085;--accent:#3157d5;--human:#fff7e6;--agent:#eef4ff;--channel:#eefbf4}
    *{box-sizing:border-box}html,body,#root{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border)}
    .title{display:flex;align-items:baseline;gap:12px;min-width:0}.title h1{font-size:17px;margin:0}.title span{font-size:12px;color:var(--muted)}
    .nav{display:flex;gap:8px}.nav a{color:var(--text);text-decoration:none;border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px}.nav a.active{border-color:#9fb0ed;background:#f0f4ff;color:#2446b2}
    .canvas{position:relative;min-height:0}.react-flow__node{border:0!important;background:transparent!important;box-shadow:none!important;padding:0!important}.atlas-node{min-width:190px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 8px 26px rgba(16,24,40,.08);overflow:hidden}.atlas-node .kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 12px 0}.atlas-node .name{font-size:15px;font-weight:650;padding:5px 12px 12px}.atlas-node.human{background:var(--human)}.atlas-node.agent{background:var(--agent)}.atlas-node.channel{background:var(--channel)}
    .react-flow__edge-path{stroke:#7c8ba1;stroke-width:1.7}.react-flow__edge-text{font-size:11px;fill:#475467}.react-flow__edge-textbg{fill:#fff;fill-opacity:.94}.react-flow__handle{width:9px;height:9px;background:#5d6b80;border:2px solid #fff}
    .legend{position:absolute;z-index:5;left:18px;bottom:18px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:12px;padding:9px 11px;color:var(--muted);font-size:11px;pointer-events:none}
    @media(max-width:720px){.title span{display:none}.nav a:first-child,.nav a:nth-child(2){display:none}.topbar{padding:12px}.atlas-node{min-width:155px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import React, { useCallback } from 'https://cdn.jsdelivr.net/npm/react@18.3.1/+esm';
  import { createRoot } from 'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm';
  import { ReactFlow, Background, Controls, MiniMap, Handle, Position, addEdge, useNodesState, useEdgesState, MarkerType } from 'https://cdn.jsdelivr.net/npm/@xyflow/react@12.11.2/+esm';

  const h = React.createElement;

  function AtlasNode({ data }) {
    return h('div',{className:`atlas-node ${data.tone}`},
      h(Handle,{type:'target',position:Position.Left}),
      h('div',{className:'kind'},data.kind),
      h('div',{className:'name'},data.label),
      h(Handle,{type:'source',position:Position.Right})
    );
  }

  const nodeTypes={atlas:AtlasNode};
  const initialNodes=[
    {id:'oriol',type:'atlas',position:{x:80,y:230},data:{label:'Oriol',kind:'Owner / PM',tone:'human'}},
    {id:'chatgpt',type:'atlas',position:{x:390,y:115},data:{label:'ChatGPT / Master',kind:'Master',tone:'agent'}},
    {id:'architect',type:'atlas',position:{x:710,y:230},data:{label:'Architect Agent',kind:'Agent',tone:'agent'}},
    {id:'telegram',type:'atlas',position:{x:390,y:360},data:{label:'Telegram',kind:'Interface / Channel',tone:'channel'}}
  ];
  const initialEdges=[
    {id:'o-c',source:'oriol',target:'chatgpt',label:'intent / decisions',type:'smoothstep',markerEnd:{type:MarkerType.ArrowClosed}},
    {id:'c-a',source:'chatgpt',target:'architect',label:'delegate / route',type:'smoothstep',markerEnd:{type:MarkerType.ArrowClosed}},
    {id:'a-c',source:'architect',target:'chatgpt',label:'result / evidence',type:'smoothstep',markerEnd:{type:MarkerType.ArrowClosed}},
    {id:'t-o',source:'telegram',target:'oriol',label:'attention / delivery',type:'smoothstep',markerEnd:{type:MarkerType.ArrowClosed}}
  ];

  function App(){
    const [nodes,setNodes,onNodesChange]=useNodesState(initialNodes);
    const [edges,setEdges,onEdgesChange]=useEdgesState(initialEdges);
    const onConnect=useCallback((params)=>setEdges((eds)=>addEdge({...params,type:'smoothstep',markerEnd:{type:MarkerType.ArrowClosed}},eds)),[]);
    return h('div',{className:'app'},
      h('header',{className:'topbar'},
        h('div',{className:'title'},h('h1',null,'Atlas · React Flow Prototype'),h('span',null,'4 nodes · interaction test')),
        h('nav',{className:'nav'},
          h('a',{href:'./index.html'},'Overview'),
          h('a',{href:'./flow.html'},'Relational Flow'),
          h('a',{href:'./react-flow-test.html',className:'active'},'React Flow Test')
        )
      ),
      h('main',{className:'canvas'},
        h(ReactFlow,{nodes,edges,nodeTypes,onNodesChange,onEdgesChange,onConnect,fitView:true,fitViewOptions:{padding:.25},minZoom:.35,maxZoom:1.8,defaultEdgeOptions:{type:'smoothstep'},proOptions:{hideAttribution:false}},
          h(Background,{gap:22,size:1,color:'#dfe5ec'}),
          h(MiniMap,{pannable:true,zoomable:true,nodeStrokeWidth:3}),
          h(Controls,null)
        ),
        h('div',{className:'legend'},'Arrossega nodes · zoom/pan · connecta handles')
      )
    );
  }

  createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
